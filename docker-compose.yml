services:

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    restart: always
    expose:
      - 5672
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: secret
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit log_levels [{connection,error}]"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3

  apigateway:
    container_name: apigateway
    restart: always
    build:
      context: api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongoadmin:secret@gatewaydb:27017/users?authSource=admin
      PORT: 3000
      READ_SERVICE_URL: http://readservice:3000
      SUBMISSION_SERVICE_URL: http://submissionservice:3000
      TARGET_SERVICE_URL: http://targetservice:3000
    depends_on:
      gatewaydb:
        condition: service_started

  gatewaydb:
    container_name: gatewaydb
    image: mongo:latest
    restart: always
    expose:
      - 27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - gatewaydb:/data/db

  readservice:
    container_name: readservice
    restart: always
    build:
      context: read-service
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongoadmin:secret@readservicedb:27017/read?authSource=admin
      RABBITMQ_URL: amqp://user:secret@rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      readservicedb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  readservicedb:
    container_name: readservicedb
    image: mongo:latest
    restart: always
    expose:
      - 27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - readservicedb:/data/db

  targetservice:
    container_name: targetservice
    restart: always
    build:
      context: target-service
      dockerfile: Dockerfile
    environment:
      MONGO_URL: mongodb://mongoadmin:secret@targetdb:27017/targets?authSource=admin
      RABBITMQ_URL: amqp://user:secret@rabbitmq
      RABBITMQ_PORT: 5672
      PORT: 3000
    depends_on:
      rabbitmq:
        condition: service_healthy
      targetdb:
        condition: service_started

  targetdb:
    container_name: targetdb
    image: mongo:latest
    restart: always
    expose:
      - 27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - targetdb:/data/db

  submissionservice:
    container_name: submissionservice
    restart: always
    build:
      context: submission-service
      dockerfile: Dockerfile
    environment:
      RABBITMQ_URL: amqp://user:secret@rabbitmq
      RABBITMQ_PORT: 5672
      PORT: 3000
      MONGO_URL: mongodb://mongoadmin:secret@submissiondb:27017/submissions?authSource=admin
      IMAGGA_KEY: acc_58905f59a7ab950
      IMAGGA_SECRET: f87b5df804c244181167631ac6a3ec5a
      IMAGGA_ENDPOINT: https://api.imagga.com
      IMAGGA_AUTH: YWNjXzU4OTA1ZjU5YTdhYjk1MDpmODdiNWRmODA0YzI0NDE4MTE2NzYzMWFjNmEzZWM1YQ==
    depends_on:
      submissiondb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  submissiondb:
    container_name: submissiondb
    image: mongo:latest
    restart: always
    expose:
      - 27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - submissiondb:/data/db

volumes:
  submissiondb:
  targetdb:
  readservicedb:
  gatewaydb:
  rabbitmq:
